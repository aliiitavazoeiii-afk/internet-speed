services:
  vpn-diagnostics:
    build: .
    container_name: vpn-diagnostics
    restart: unless-stopped
    environment:
      PORT: "8097"
      HOST: "0.0.0.0"
      TRUST_PROXY: "1"
      NODE_LABEL: "سرور تست"
    ports:
      - "127.0.0.1:8097:8097"
    volumes:
      - report-data:/app/data
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8097/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    pids_limit: 80
    security_opt:
      - no-new-privileges:true
volumes:
  report-data:
